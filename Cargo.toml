[package]
name = "stardust"
version = "0.1.0"
edition = "2024"

[features]
# Test tools (bot, direct screens, god mode). Not part of the released game.
dev = []

[dependencies]
gilrs = "0.11"
macroquad = { version = "0.4", features = ["audio"] }
sys-locale = "0.3"

# Borderless fullscreen on the monitor the window is on (the stock one always picks the primary).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Optimize dependencies even in debug builds so `cargo run` stays smooth.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true

[build-dependencies]
embed-resource = "3.0.12"
